<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AION Payment Confirmation</title><style>body{font-family:Arial;background:#020817;color:#fff;min-height:100vh;display:grid;place-items:center}.box{width:min(650px,92vw);padding:35px;border:1px solid #1d9bf0;border-radius:24px;background:#07142b;text-align:center}h1{color:#00c8ff}p{color:#b9c8dc;line-height:1.6}.ok{color:#7dffb2;font-size:22px;font-weight:900}.err{color:#ff8e8e}.btn{display:inline-block;margin-top:20px;padding:13px 24px;border-radius:30px;background:#f5c542;color:#020817;text-decoration:none;font-weight:900}</style></head><body><div class="box"><h1>AION</h1><div id="state">Confirming your payment securely…</div><a class="btn" href="/">Return to AION</a></div>
<script>
const orderId=new URLSearchParams(location.search).get('orderId'),state=document.getElementById('state');
(async()=>{if(!orderId){state.innerHTML='<p class="err">Missing order reference.</p>';return}try{const r=await fetch('/api/customer-revenue?path=capture',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({orderId})});const d=await r.json();if(!r.ok||!d.success)throw new Error(d.error||'Payment confirmation failed');state.innerHTML='<div class="ok">Payment confirmed successfully.</div><p>Your AION order is now paid. Delivery can proceed through the verified order pipeline.</p>'}catch(e){state.innerHTML='<p class="err">'+e.message+'</p><p>If you were charged, do not pay again; contact AION with your order reference.</p>'}})();
</script></body></html>
