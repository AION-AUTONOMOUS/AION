<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AION Payment Confirmation</title><style>body{font-family:Arial;background:#020817;color:#fff;min-height:100vh;display:grid;place-items:center}.box{width:min(650px,92vw);padding:35px;border:1px solid #1d9bf0;border-radius:24px;background:#07142b;text-align:center}h1{color:#00c8ff}p{color:#b9c8dc;line-height:1.6}.ok{color:#7dffb2;font-size:22px;font-weight:900}.err{color:#ff8e8e}.btn{display:inline-block;margin-top:20px;padding:13px 24px;border-radius:30px;background:#f5c542;color:#020817;text-decoration:none;font-weight:900}</style></head><body><div class="box"><h1>AION</h1><div id="state">Confirming your payment securely…</div><button id="printBtn" class="btn" type="button" onclick="window.print()" style="display:none">🖨️ طباعة تأكيد الشراء</button><a class="btn" href="/">Return to AION</a></div>
<script>
const orderId=new URLSearchParams(location.search).get('orderId');
const state=document.getElementById('state');
const printBtn=document.getElementById('printBtn');
function showMessage(className,message){
  const p=document.createElement('p');
  p.className=className;
  p.textContent=message;
  state.replaceChildren(p);
}
(async()=>{
  if(!orderId||!/^[A-Z0-9-]{8,64}$/.test(orderId)){
    showMessage('err','Missing or invalid order reference.');
    return;
  }
  try{
    const r=await fetch('/api/customer-revenue?path=capture',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({orderId})
    });
    const d=await r.json();
    if(!r.ok||!d.success)throw new Error(d.error||'Payment confirmation failed');
    state.replaceChildren();
    const ok=document.createElement('div');
    ok.className='ok';
    ok.textContent='Payment confirmed successfully.';
    state.appendChild(ok);
    const paid=document.createElement('p');
    paid.textContent='Your AION order is now paid. Delivery can proceed through the verified order pipeline.';
    state.appendChild(paid);
    const reference=document.createElement('p');
    const label=document.createElement('strong');
    label.textContent='رقم الطلب: ';
    reference.append(label,document.createTextNode(orderId));
    state.appendChild(reference);
    const amount=document.createElement('p');
    amount.textContent='المبلغ: سيتم طباعته من صفحة تأكيد الطلب.';
    state.appendChild(amount);
    printBtn.style.display='inline-block';
  }catch(e){
    showMessage('err',String(e?.message||'Payment confirmation failed'));
    const note=document.createElement('p');
    note.textContent='If you were charged, do not pay again; contact AION with your order reference.';
    state.appendChild(note);
  }
})();
</script></body></html>
