<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AION Chat | تحدث مع الجيش الذكي</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Arial,Tahoma,sans-serif;background:radial-gradient(circle at 75% 10%,rgba(122,75,255,.18),transparent 30%),#020817;color:#fff;min-height:100vh;padding:14px}
a{text-decoration:none;color:inherit}
.container{max-width:900px;margin:auto}
.topnav{display:flex;justify-content:space-between;align-items:center;padding:12px 22px;background:rgba(2,15,40,.9);backdrop-filter:blur(15px);border:1px solid rgba(0,180,255,.25);border-radius:16px;margin-bottom:20px;flex-wrap:wrap;gap:12px}
.logo{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:900;color:#fff;letter-spacing:2px}
.logo svg{width:32px;height:32px}
.logo .s{font-size:8px;color:#00c8ff;letter-spacing:3px;margin-top:2px}
.menu a{color:#c8d5e7;text-decoration:none;font-size:11px;font-weight:600;margin-left:10px;transition:.3s}
.menu a:hover{color:#00c8ff}
.lang-btn{padding:6px 12px;background:rgba(0,180,255,.1);border:1px solid rgba(0,200,255,.4);border-radius:20px;color:#00c8ff;font-size:11px;font-weight:bold;cursor:pointer;display:inline-block;font-family:inherit;margin-left:10px}
h1{color:#00c8ff;text-align:center;font-size:clamp(22px,4vw,30px);margin-bottom:8px}
.sub{text-align:center;color:#aebbd0;margin-bottom:22px;font-size:13px}
.role-select{width:100%;padding:14px;border-radius:12px;background:#020817;color:#00c8ff;border:1px solid rgba(0,200,255,.4);margin-bottom:14px;font-size:14px;font-family:inherit;font-weight:bold}
.role-select:focus{outline:none;border-color:#f5c542}
.chat-box{background:rgba(2,15,40,.7);border:1px solid rgba(0,180,255,.25);border-radius:20px;padding:20px;margin-bottom:14px;min-height:400px;max-height:500px;overflow-y:auto}
.msg{margin-bottom:15px;padding:12px 16px;border-radius:14px;max-width:85%;line-height:1.7;word-wrap:break-word;white-space:pre-wrap}
.msg.user{background:rgba(245,197,66,.15);border:1px solid rgba(245,197,66,.4);margin-right:auto;color:#f5e6a8}
.msg.ai{background:rgba(122,75,255,.12);border:1px solid rgba(122,75,255,.4);margin-left:auto;color:#d0c8ff}
.msg .role{font-size:11px;color:#f5c542;font-weight:bold;margin-bottom:5px;display:block}
.msg.ai .role{color:#00c8ff}
.input-row{display:flex;gap:10px}
textarea{flex:1;padding:14px;border-radius:12px;background:#020817;color:#fff;border:1px solid rgba(0,200,255,.4);font-family:inherit;font-size:14px;resize:none;min-height:55px;max-height:150px}
textarea:focus{outline:none;border-color:#f5c542}
button.send{background:linear-gradient(135deg,#f5c542,#e6a800);color:#020817;border:none;padding:14px 25px;border-radius:12px;font-weight:900;font-size:14px;cursor:pointer;font-family:inherit;transition:.3s}
button.send:hover{transform:translateY(-2px)}
button.send:disabled{opacity:.5;cursor:not-allowed;transform:none}
.loading{text-align:center;color:#00c8ff;padding:10px;font-size:13px;display:none}
.loading.active{display:block}
.spinner{display:inline-block;width:18px;height:18px;border:3px solid rgba(0,200,255,.2);border-top-color:#00c8ff;border-radius:50%;animation:spin 1s linear infinite;vertical-align:middle;margin-left:6px}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:600px){.menu a{font-size:10px;margin-left:6px}textarea{font-size:13px}button.send{padding:12px 18px;font-size:13px}}
</style>
</head>
<body>
<div class="container">

<div class="topnav">
<div class="logo">
<svg viewBox="0 0 100 100"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00c8ff"/><stop offset="1" stop-color="#7A4BFF"/></linearGradient></defs><path d="M50 8 L88 88 L72 88 L50 38 L28 88 L12 88 Z" fill="url(#g)"/><circle cx="50" cy="58" r="7" fill="#f5c542"/></svg>
<div>AION<div class="s">CHAT</div></div>
</div>
<div class="menu">
<a href="index.html">الرئيسية</a>
<a href="teacher.html">المعلم</a>
<a href="academy.html">Academy</a>
<a href="coin.html">AION Coin</a>
<a href="wallet.html">المحفظة</a>
<span class="lang-btn">اللغات</span>
</div>
</div>

<h1>AION Chat</h1>
<p class="sub">تحدث مع الجيش الذكي — اختر وكيلًا واكتب مهمتك</p>

<select class="role-select" id="role">
<option value="researcher">باحث — Researcher</option>
<option value="analyst">محلل — Analyst</option>
<option value="marketer">مسوق — Marketer</option>
<option value="sales">مبيعات — Sales</option>
<option value="coder">مبرمج — Coder</option>
<option value="auditor">مدقق — Auditor</option>
<option value="legal">قانوني — Legal</option>
<optgroup label="────── الأقسام الكاملة ──────">
<option value="research">قسم الأبحاث — 10 وكلاء</option>
<option value="marketing">قسم التسويق — 10,000 دور ذكي</option>
<option value="development">قسم التطوير — 15 وكيل</option>
<option value="support">قسم الدعم — 15 وكيل</option>
<option value="content">قسم المحتوى — 15 وكيل</option>
<option value="analysis">قسم التحليل — 5 وكلاء</option>
<option value="security">قسم الأمان — 5 وكلاء</option>
</optgroup>
</select>

<div class="chat-box" id="chatBox">
<div class="msg ai">
<span class="role">AION CORE</span>
مرحبًا! اختر الوكيل، واكتب مهمتك بالعربية أو الإنجليزية.
</div>
</div>

<div class="loading" id="loading">جاري التفكير...<span class="spinner"></span></div>

<div class="input-row">
<textarea id="input" placeholder="اكتب رسالتك هنا..."></textarea>
<button class="send" onclick="sendMessage()" id="sendBtn">إرسال</button>
</div>

</div>

<script>
async function sendMessage() {
  const input = document.getElementById('input');
  const role = document.getElementById('role').value;
  const chatBox = document.getElementById('chatBox');
  const loading = document.getElementById('loading');
  const sendBtn = document.getElementById('sendBtn');
  const message = input.value.trim();
  if (!message) return;

  chatBox.innerHTML += '<div class="msg user"><span class="role">أنت</span>' + escapeHtml(message) + '</div>';
  input.value = '';
  chatBox.scrollTop = chatBox.scrollHeight;
  loading.classList.add('active');
  sendBtn.disabled = true;

  try {
    const response = await fetch('/api/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message: message, role: role})
    });
    const data = await response.json();
    loading.classList.remove('active');
    sendBtn.disabled = false;
    if (data.success) {
      const agentLabel = data.agent ? (data.agent.name + ' • ' + data.agent.id) : role.toUpperCase();
      chatBox.innerHTML += '<div class="msg ai"><span class="role">' + escapeHtml(agentLabel) + '</span>' + escapeHtml(data.reply) + '</div>';
    } else {
      chatBox.innerHTML += '<div class="msg ai"><span class="role">خطأ</span>' + escapeHtml(data.error || 'Unknown') + '</div>';
    }
  } catch (error) {
    loading.classList.remove('active');
    sendBtn.disabled = false;
    chatBox.innerHTML += '<div class="msg ai"><span class="role">خطأ</span>تعذر الاتصال: ' + escapeHtml(error.message) + '</div>';
  }
  chatBox.scrollTop = chatBox.scrollHeight;
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

document.getElementById('input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
</script>

<script src="lang.js"></script>

</body>
</html>
