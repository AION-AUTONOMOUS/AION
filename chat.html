<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AION Chat | تحدث مع الجيش الذكي</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,Tahoma,sans-serif;background:radial-gradient(circle at 75% 10%,rgba(122,75,255,.18),transparent 30%),#0B1D3A;color:#fff;min-height:100vh;padding:20px}
.container{max-width:800px;margin:auto}
h1{color:#D4AF37;text-align:center;margin-bottom:10px;font-size:32px}
.sub{text-align:center;color:#aebbd0;margin-bottom:25px;font-size:14px}
.chat-box{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:20px;margin-bottom:20px;min-height:400px;max-height:500px;overflow-y:auto}
.msg{margin-bottom:15px;padding:12px 16px;border-radius:14px;max-width:85%;line-height:1.7;word-wrap:break-word}
.msg.user{background:rgba(212,175,55,.15);border:1px solid rgba(212,175,55,.4);margin-right:auto;color:#f5e6a8}
.msg.ai{background:rgba(122,75,255,.12);border:1px solid rgba(122,75,255,.4);margin-left:auto;color:#d0c8ff}
.msg .role{font-size:11px;color:#D4AF37;font-weight:bold;margin-bottom:5px;display:block}
.role-select{width:100%;padding:12px;border-radius:10px;background:#0B1D3A;color:#D4AF37;border:1px solid rgba(255,255,255,.2);margin-bottom:12px;font-size:14px;font-family:inherit}
.input-row{display:flex;gap:10px}
textarea{flex:1;padding:14px;border-radius:12px;background:#0B1D3A;color:#fff;border:1px solid rgba(255,255,255,.2);font-family:inherit;font-size:15px;resize:none;min-height:55px;max-height:150px}
button{background:linear-gradient(135deg,#D4AF37,#f2d477);color:#0B1D3A;border:none;padding:14px 25px;border-radius:12px;font-weight:900;font-size:15px;cursor:pointer;font-family:inherit}
button:hover{transform:translateY(-2px)}
button:disabled{opacity:.5;cursor:not-allowed;transform:none}
.loading{text-align:center;color:#D4AF37;padding:10px;font-size:14px;display:none}
.back{display:block;text-align:center;margin-top:20px;color:#D4AF37;text-decoration:none;font-weight:bold}
</style>
</head>
<body>
<div class="container">
<h1>🤖 AION Chat</h1>
<p class="sub">تحدث مع الجيش الذكي — اختر وكيلًا واكتب مهمتك</p>

<select class="role-select" id="role">
<option value="researcher">🔍 باحث — Research</option>
<option value="analyst">📊 محلل — Analysis</option>
<option value="marketer">📣 مسوق — Marketing</option>
<option value="sales">💼 مبيعات — Sales</option>
<option value="coder">💻 مبرمج — Coder</option>
<option value="auditor">🔎 مدقق — Auditor</option>
<option value="legal">⚖️ قانوني — Legal</option>
</select>

<div class="chat-box" id="chatBox">
<div class="msg ai">
<span class="role">AION CORE</span>
مرحبًا! اختر الوكيل الذي تريد، واكتب مهمتك بالعربية. سأوجه طلبك للوكيل المختص.
</div>
</div>

<div class="loading" id="loading">جاري التفكير...</div>

<div class="input-row">
<textarea id="input" placeholder="اكتب رسالتك هنا..."></textarea>
<button id="sendBtn" onclick="sendMessage()">إرسال</button>
</div>

<a href="index.html" class="back">← العودة للموقع الرئيسي</a>
</div>

<script>
async function sendMessage() {
    const input = document.getElementById('input');
    const role = document.getElementById('role').value;
    const chatBox = document.getElementById('chatBox');
    const loading = document.getElementById('loading');
    const sendBtn = document.getElementById('sendBtn');
    
    const message = input.value.trim();
    if (!message) return;
    
    // Add user message
    chatBox.innerHTML += '<div class="msg user"><span class="role">أنت</span>' + escapeHtml(message) + '</div>';
    input.value = '';
    chatBox.scrollTop = chatBox.scrollHeight;
    
    loading.style.display = 'block';
    sendBtn.disabled = true;
    
    try {
        const response = await fetch('/api/chat', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({message: message, role: role})
        });
        
        const data = await response.json();
        loading.style.display = 'none';
        sendBtn.disabled = false;
        
        if (data.success) {
            chatBox.innerHTML += '<div class="msg ai"><span class="role">' + role.toUpperCase() + '</span>' + escapeHtml(data.reply) + '</div>';
        } else {
            chatBox.innerHTML += '<div class="msg ai"><span class="role">خطأ</span>حدث خطأ: ' + escapeHtml(data.error || 'Unknown') + '</div>';
        }
    } catch (error) {
        loading.style.display = 'none';
        sendBtn.disabled = false;
        chatBox.innerHTML += '<div class="msg ai"><span class="role">خطأ</span>تعذر الاتصال: ' + escapeHtml(error.message) + '</div>';
    }
    
    chatBox.scrollTop = chatBox.scrollHeight;
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// Send on Enter (Shift+Enter for new line)
document.getElementById('input').addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
    }
});
</script>
</body>
</html>
