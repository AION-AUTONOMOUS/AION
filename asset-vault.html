<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AION Global Asset Vault</title><style>body{font-family:system-ui,sans-serif;margin:0;background:#0b1020;color:#eef2ff}main{max-width:1100px;margin:auto;padding:32px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}.card{background:#151c31;border:1px solid #2a3555;border-radius:16px;padding:20px}.value{font-size:28px;font-weight:700}small{color:#9aa7c7}.status{margin:20px 0;padding:14px;border-radius:12px;background:#121a2d}table{width:100%;border-collapse:collapse;margin-top:20px}td,th{text-align:left;padding:10px;border-bottom:1px solid #27324d}</style></head><body><main><h1>AION GLOBAL ASSET VAULT</h1><p><small>Real assets • evidence • verification • AI intelligence</small></p><div id="status" class="status">Loading live vault state…</div><section class="grid"><div class="card"><small>Verified Value</small><div id="value" class="value">$0</div></div><div class="card"><small>Verified Assets</small><div id="assets" class="value">0</div></div><div class="card"><small>AI Value Units</small><div id="units" class="value">0</div></div><div class="card"><small>Target Valuation</small><div class="value">$10,000,000</div></div></section><table><thead><tr><th>Asset</th><th>Class</th><th>Verified</th><th>AI Unit</th><th>Verified Value</th></tr></thead><tbody id="rows"></tbody></table><script>async function load(){const s=document.getElementById('status');try{const r=await fetch('/api/asset-vault-ai-state');const d=await r.json();if(!r.ok)throw Error(d.error||'Unauthorized');document.getElementById('value').textContent='$'+Number(d.verifiedValueUsd||0).toLocaleString();document.getElementById('assets').textContent=d.verifiedAssetCount||0;document.getElementById('units').textContent=d.linkedAiValueUnitCount||0;s.textContent='Live status: '+(d.valueStatus?.status||'UNKNOWN');document.getElementById('rows').innerHTML=(d.assets||[]).map(x=>'<tr><td>'+String(x.assetId)+'</td><td>'+String(x.assetClass||'—')+'</td><td>'+String(x.verified)+'</td><td>'+String(x.aiValueUnitId||'—')+'</td><td>$'+Number(x.aiValueUsd||0).toLocaleString()+'</td></tr>').join('')}catch(e){s.textContent='Live vault state unavailable: '+e.message}}load()</script></main></body></html>
