<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AION Checkout</title><meta name="description" content="Secure AION digital intelligence checkout.">
<style>body{font-family:Arial,sans-serif;background:#020817;color:#fff;margin:0;min-height:100vh;display:grid;place-items:center}.box{width:min(680px,92vw);padding:32px;border:1px solid #1d9bf0;border-radius:24px;background:#07142b;box-shadow:0 20px 70px #0008}h1{margin-top:0;color:#00c8ff}p{color:#b9c8dc;line-height:1.6}label{display:block;margin:18px 0 7px;color:#dce7f5;font-weight:700}input,button{width:100%;padding:14px;border-radius:12px;border:1px solid #31577e;box-sizing:border-box}input{background:#020817;color:#fff}button{margin-top:22px;background:#f5c542;color:#020817;border:0;font-weight:900;cursor:pointer}.status{margin-top:18px;min-height:24px;color:#9dd9ff}.price{font-size:28px;color:#f5c542;font-weight:900}small{color:#7f91a8}</style></head>
<body><div class="box"><h1>AION Secure Checkout</h1><p id="offer">Loading offer…</p><div class="price" id="price"></div><form id="form"><label for="customerId">Email</label><input id="customerId" type="email" autocomplete="email" required placeholder="you@example.com"><button type="submit">Continue to PayPal</button></form><div class="status" id="status"></div><p><small>Payment is processed by PayPal. AION recognizes revenue only after server-side confirmation of the completed payment.</small></p></div>
<script>
const qs=new URLSearchParams(location.search), offerId=qs.get('offer')||'earth-change-intelligence', api='/api/customer-revenue?path=';
async function load(){const r=await fetch(api+'offer&id='+encodeURIComponent(offerId));const d=await r.json();if(!d.offer)throw new Error('Offer not found');document.getElementById('offer').textContent=d.offer.name;document.getElementById('price').textContent='$'+Number(d.offer.priceUsd).toFixed(2)+' USD'}
document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const s=document.getElementById('status');s.textContent='Creating secure PayPal checkout…';try{const customerId=document.getElementById('customerId').value.trim();const r=await fetch(api+'checkout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({offerId,customerId})});const d=await r.json();if(!r.ok||!d.success)throw new Error(d.error||'Checkout could not be created');location.href=d.payment.approvalUrl}catch(err){s.textContent=err.message}});
load().catch(e=>document.getElementById('status').textContent=e.message);
</script></body></html>
