name: AION Public Endpoint Health Check

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: read

concurrency:
  group: aion-public-health-check
  cancel-in-progress: true

jobs:
  check-public-endpoints:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public endpoints (reachability only)
        shell: bash
        run: |
          set -uo pipefail
          failures=0

          check_url() {
            local label="$1"
            local url="$2"
            local code
            local rc=0

            code="$(curl --silent --show-error --location \
              --connect-timeout 10 --max-time 25 \
              --output /dev/null --write-out '%{http_code}' \
              "$url" 2>/dev/null)" || rc=$?

            if [ "$rc" -eq 0 ] && [[ "$code" =~ ^[23][0-9][0-9]$ ]]; then
              printf 'PASS | %s | HTTP %s | %s\n' "$label" "$code" "$url"
            else
              printf 'FAIL | %s | curl_exit=%s HTTP=%s | %s\n' "$label" "$rc" "${code:-none}" "$url"
              failures=$((failures + 1))
            fi
          }

          check_url "AION primary web" "https://aion-production-fbf3.up.railway.app/"
          check_url "SI Exchange demo" "https://si-exchange-1vq1.vercel.app/"

          if [ "$failures" -gt 0 ]; then
            echo "::error::$failures public endpoint check(s) failed. This checks reachability only, not product correctness, ownership, security, or revenue."
            exit 1
          fi

          echo "All configured public endpoints responded with HTTP 2xx/3xx."
          echo "IMPORTANT: reachability is not proof that every feature is functional or that AION owns the hosting provider."

      - name: Record check context
        if: always()
        shell: bash
        run: |
          echo "Checked at UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "This workflow performs read-only HTTP checks and does not use secrets or create paid resources."
