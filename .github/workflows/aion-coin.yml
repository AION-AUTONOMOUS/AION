name: AION Coin CI

on:
  push:
    paths:
      - "aion_coin.sol"
      - "hardhat.config.js"
      - "scripts/deploy-aion-coin.js"
      - "test/aion-coin.test.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/aion-coin.yml"
  pull_request:
    paths:
      - "aion_coin.sol"
      - "hardhat.config.js"
      - "scripts/deploy-aion-coin.js"
      - "tests/aion-coin.test.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/aion-coin.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm run compile:coin
      - run: npm run test:coin
