name: Publish AION Global Launch Page
on:
  push:
    branches: [main]
    paths:
      - "public-launch/**"
      - ".github/workflows/publish-global-pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "github-pages"
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload only the public launch page
        uses: actions/upload-pages-artifact@v3
        with:
          path: public-launch
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
