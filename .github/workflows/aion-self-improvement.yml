name: AION Self Improvement
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  improve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - name: Run baseline checks
        run: node --test
      - name: Compile contracts
        run: npx hardhat compile
      - name: Detect repository changes
        run: git status --short
      - name: Prepare evidence
        run: mkdir -p reports && printf '# AION Self Improvement\n\nUTC: %s\n' "$(date -u)" > reports/self-improvement.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aion-self-improvement
          path: reports/self-improvement.md
