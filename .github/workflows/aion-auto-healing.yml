name: AION Auto-Healing

on:
  push:
    paths:
      - ".github/workflows/aion-auto-healing.yml"
  workflow_run:
    workflows:
      - "AION Distributed Real Work"
      - "AION Security Shield"
      - "AION Autonomous Maintenance"
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: aion-auto-healing
  cancel-in-progress: false

jobs:
  diagnose:
    # Diagnose every watched workflow completion, whether it passed or failed.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          # No npm cache: this repository currently has no package-lock.json.

      - name: Install dependencies
        id: install
        continue-on-error: true
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Audit dependencies
        id: audit
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Compile smart contracts
        id: compile
        continue-on-error: true
        run: npx --no-install hardhat compile

      - name: Run automated tests
        id: tests
        continue-on-error: true
        run: npm test

      - name: Report diagnostic result
        if: always()
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          SOURCE_WORKFLOW: ${{ github.event.workflow_run.name || github.workflow }}
          SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion || 'manual_dispatch' }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id || github.run_id }}
          SOURCE_RUN_URL: ${{ github.event.workflow_run.html_url || '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          body_file="$RUNNER_TEMP/aion-diagnostic-report.md"
          {
            echo "## AION Auto-Healing diagnostic report"
            echo
            printf '%s\\n' "- Trigger: ${{ github.event_name }}"
            printf '%s\\n' "- Source workflow: ${SOURCE_WORKFLOW}"
            printf '%s\\n' "- Source conclusion: ${SOURCE_CONCLUSION}"
            printf '%s\\n' "- Install dependencies: ${INSTALL_OUTCOME:-not_run}"
            printf '%s\\n' "- Dependency audit: ${AUDIT_OUTCOME:-not_run}"
            printf '%s\\n' "- Contract compilation: ${COMPILE_OUTCOME:-not_run}"
            printf '%s\\n' "- Automated tests: ${TESTS_OUTCOME:-not_run}"
            echo
            if [[ -n "${SOURCE_RUN_URL:-}" ]]; then
              printf 'Source run: %s\\n' "$SOURCE_RUN_URL"
            fi
            printf 'Diagnostic run: %s/%s/actions/runs/%s\\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            echo
            echo "This workflow diagnoses every watched completion. It does not silently modify dependency files or merge repairs into main."
          } > "$body_file"

          if [[ "$INSTALL_OUTCOME" == "failure" || "$AUDIT_OUTCOME" == "failure" || "$COMPILE_OUTCOME" == "failure" || "$TESTS_OUTCOME" == "failure" || "$SOURCE_CONCLUSION" == "failure" ]]; then
            existing_issue="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'in:title "AION automated security incident"' --limit 1 --json number --jq '.[0].number // ""')"
            if [[ -n "$existing_issue" ]]; then
              gh issue edit "$existing_issue" --body-file "$body_file"
              echo "Updated existing diagnostic incident #$existing_issue."
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "AION automated security incident" --body-file "$body_file"
            fi
          else
            echo "All diagnostic checks passed."
          fi

      - name: Fail the run if a diagnostic check failed
        if: steps.install.outcome == 'failure' || steps.audit.outcome == 'failure' || steps.compile.outcome == 'failure' || steps.tests.outcome == 'failure'
        run: |
          echo "One or more diagnostic checks failed. See the preceding steps and incident report."
          exit 1
