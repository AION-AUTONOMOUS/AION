name: Financial Core Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "financial-core/**"
      - "tests/financial-core-journal.test.js"
      - "package.json"
      - ".github/workflows/financial-core-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  financial-core:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Run financial core tests
        run: node --test tests/financial-core-journal.test.js
