name: AION Smart Contracts

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Compile contracts
        run: npx hardhat compile

      - name: Run Solidity tests
        run: npx hardhat test solidity

      - name: Check API JavaScript syntax
        run: |
          node --check api/paypal/services.js
          node --check api/paypal/create-order.js
          node --check api/paypal/capture-order.js
          node --check api/verify.js
          node --check api/presale.js
          node --check api/chat.js

      - name: Run API unit tests
        run: node --test test/paypal-services.test.js
