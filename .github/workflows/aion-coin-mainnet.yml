
name: AION Coin Mainnet Deployment

on:
  workflow_dispatch:
    inputs:
      confirm_mainnet_deployment:
        description: "Confirm treasury addresses, token allocation, audit status, and gas funding have been reviewed"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy:
    if: inputs.confirm_mainnet_deployment == true
    runs-on: ubuntu-latest
    environment: aion-coin-mainnet

    env:
      BSC_RPC_URL: ${{ secrets.BSC_RPC_URL || 'https://bsc-dataseed.bnbchain.org' }}
      AION_ALLOW_MAINNET_DEPLOYMENT: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Compile and test token
        run: |
          npm run compile:coin
          npm run test:coin

      - name: Validate mainnet configuration
        env:
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          AION_CHARITY_TREASURY: ${{ secrets.AION_CHARITY_TREASURY }}
          AION_FOUNDER_TREASURY: ${{ secrets.AION_FOUNDER_TREASURY }}
          AION_DEVELOPMENT_TREASURY: ${{ secrets.AION_DEVELOPMENT_TREASURY }}
          AION_COMMUNITY_TREASURY: ${{ secrets.AION_COMMUNITY_TREASURY }}
          AION_DIGITAL_RESERVE: ${{ secrets.AION_DIGITAL_RESERVE }}
        run: |
          set -euo pipefail

          for name in \
            DEPLOYER_PRIVATE_KEY \
            AION_CHARITY_TREASURY \
            AION_FOUNDER_TREASURY \
            AION_DEVELOPMENT_TREASURY \
            AION_COMMUNITY_TREASURY \
            AION_DIGITAL_RESERVE
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required GitHub environment secret is missing: $name"
              exit 1
            fi
          done

          if [ -z "${BSC_RPC_URL:-}" ]; then
            echo "::error::Mainnet RPC URL is empty"
            exit 1
          fi

          echo "Required secrets are present."
          echo "Address, network, and deployment validation must pass before deployment."

      - name: Deploy AION Coin to BNB Smart Chain Mainnet
        env:
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          AION_CHARITY_TREASURY: ${{ secrets.AION_CHARITY_TREASURY }}
          AION_FOUNDER_TREASURY: ${{ secrets.AION_FOUNDER_TREASURY }}
          AION_DEVELOPMENT_TREASURY: ${{ secrets.AION_DEVELOPMENT_TREASURY }}
          AION_COMMUNITY_TREASURY: ${{ secrets.AION_COMMUNITY_TREASURY }}
          AION_DIGITAL_RESERVE: ${{ secrets.AION_DIGITAL_RESERVE }}
        run: npm run deploy:coin:mainnet
