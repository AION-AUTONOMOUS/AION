name: AION Coin Testnet Deployment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: aion-coin-testnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install
      - run: npm run compile:coin
      - run: npm run test:coin
      - name: Validate testnet configuration
        env:
          BSC_TESTNET_RPC_URL: ${{ secrets.BSC_TESTNET_RPC_URL }}
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          AION_FOUNDER_TREASURY: ${{ secrets.AION_FOUNDER_TREASURY }}
          AION_COMMUNITY_TREASURY: ${{ secrets.AION_COMMUNITY_TREASURY }}
          AION_AI_REWARDS_TREASURY: ${{ secrets.AION_AI_REWARDS_TREASURY }}
          AION_DEVELOPMENT_TREASURY: ${{ secrets.AION_DEVELOPMENT_TREASURY }}
          AION_DIGITAL_RESERVE: ${{ secrets.AION_DIGITAL_RESERVE }}
          AION_STRATEGIC_TREASURY: ${{ secrets.AION_STRATEGIC_TREASURY }}
        run: |
          test -n "$BSC_TESTNET_RPC_URL" || (echo "Missing BSC_TESTNET_RPC_URL" && exit 1)
          test -n "$DEPLOYER_PRIVATE_KEY" || (echo "Missing DEPLOYER_PRIVATE_KEY" && exit 1)
          test -n "$AION_FOUNDER_TREASURY" || (echo "Missing AION_FOUNDER_TREASURY" && exit 1)
          test -n "$AION_COMMUNITY_TREASURY" || (echo "Missing AION_COMMUNITY_TREASURY" && exit 1)
          test -n "$AION_AI_REWARDS_TREASURY" || (echo "Missing AION_AI_REWARDS_TREASURY" && exit 1)
          test -n "$AION_DEVELOPMENT_TREASURY" || (echo "Missing AION_DEVELOPMENT_TREASURY" && exit 1)
          test -n "$AION_DIGITAL_RESERVE" || (echo "Missing AION_DIGITAL_RESERVE" && exit 1)
          test -n "$AION_STRATEGIC_TREASURY" || (echo "Missing AION_STRATEGIC_TREASURY" && exit 1)
      - name: Deploy AION Coin to BNB Testnet
        env:
          BSC_TESTNET_RPC_URL: ${{ secrets.BSC_TESTNET_RPC_URL }}
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          AION_FOUNDER_TREASURY: ${{ secrets.AION_FOUNDER_TREASURY }}
          AION_COMMUNITY_TREASURY: ${{ secrets.AION_COMMUNITY_TREASURY }}
          AION_AI_REWARDS_TREASURY: ${{ secrets.AION_AI_REWARDS_TREASURY }}
          AION_DEVELOPMENT_TREASURY: ${{ secrets.AION_DEVELOPMENT_TREASURY }}
          AION_DIGITAL_RESERVE: ${{ secrets.AION_DIGITAL_RESERVE }}
          AION_STRATEGIC_TREASURY: ${{ secrets.AION_STRATEGIC_TREASURY }}
        run: npm run deploy:coin:testnet
