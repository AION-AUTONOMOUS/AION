name: AION Coin Testnet Deployment

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    # Only manually dispatched runs or explicitly marked main commits may deploy to testnet.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-aion-coin-testnet]')
    runs-on: ubuntu-latest
    environment: aion-coin-testnet
    env:
      BSC_TESTNET_RPC_URL: ${{ secrets.BSC_TESTNET_RPC_URL || 'https://data-seed-prebsc-1-s1.bnbchain.org:8545' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - name: Diagnose Hardhat dependency versions
        run: npm ls hardhat @nomicfoundation/hardhat-zod-utils zod
      - run: npm run compile:coin
      - run: npm run test:coin
      - name: Validate testnet configuration
        env:
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          AION_CHARITY_TREASURY: ${{ secrets.AION_CHARITY_TREASURY }}
          AION_FOUNDER_TREASURY: ${{ secrets.AION_FOUNDER_TREASURY }}
          AION_DEVELOPMENT_TREASURY: ${{ secrets.AION_DEVELOPMENT_TREASURY }}
          AION_COMMUNITY_TREASURY: ${{ secrets.AION_COMMUNITY_TREASURY }}
          AION_DIGITAL_RESERVE: ${{ secrets.AION_DIGITAL_RESERVE }}
        run: |
          set -euo pipefail
          for name in DEPLOYER_PRIVATE_KEY AION_CHARITY_TREASURY AION_FOUNDER_TREASURY AION_DEVELOPMENT_TREASURY AION_COMMUNITY_TREASURY AION_DIGITAL_RESERVE; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required GitHub secret is missing: $name"
              exit 1
            fi
          done
          test -n "${BSC_TESTNET_RPC_URL:-}" || (echo "::error::Testnet RPC URL is empty" && exit 1)
          node <<'NODE'
          const raw = String(process.env.DEPLOYER_PRIVATE_KEY || '').trim();
          let key = raw;
          if ((key.startsWith('"') && key.endsWith('"')) ||
              (key.startsWith("'") && key.endsWith("'"))) {
            key = key.slice(1, -1).trim();
          }
          key = key.replace(/^0x/i, '');
          if (!/^[0-9a-fA-F]{64}$/.test(key)) {
            console.error('::error::DEPLOYER_PRIVATE_KEY must be a 32-byte hex private key (64 hex characters, optional 0x prefix). Secret value was not printed.');
            process.exit(1);
          }
          console.log('Deployer key format validated without revealing the secret.');
          NODE
          echo "Testnet configuration validated."
      - name: Deploy AION Coin to BNB Testnet
        env:
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          AION_CHARITY_TREASURY: ${{ secrets.AION_CHARITY_TREASURY }}
          AION_FOUNDER_TREASURY: ${{ secrets.AION_FOUNDER_TREASURY }}
          AION_DEVELOPMENT_TREASURY: ${{ secrets.AION_DEVELOPMENT_TREASURY }}
          AION_COMMUNITY_TREASURY: ${{ secrets.AION_COMMUNITY_TREASURY }}
          AION_DIGITAL_RESERVE: ${{ secrets.AION_DIGITAL_RESERVE }}
        run: npm run deploy:coin:testnet
