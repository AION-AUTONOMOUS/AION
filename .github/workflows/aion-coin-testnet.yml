name: AION Coin Testnet Deployment

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    # Automatic one-shot deployment is enabled only for an explicitly marked main-branch commit.
    # This lets the project operators trigger testnet from the merge itself without manual UI steps.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-aion-coin-testnet]')
    runs-on: ubuntu-latest
    environment: aion-coin-testnet
    env:
      BSC_TESTNET_RPC_URL: ${{ secrets.BSC_TESTNET_RPC_URL || 'https://data-seed-prebsc-1-s1.bnbchain.org:8545' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install
      - run: npm run compile:coin
      - run: npm run test:coin
      - name: Validate testnet configuration
        env:
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          AION_FOUNDER_TREASURY: ${{ secrets.AION_FOUNDER_TREASURY }}
          AION_COMMUNITY_TREASURY: ${{ secrets.AION_COMMUNITY_TREASURY }}
          AION_AI_REWARDS_TREASURY: ${{ secrets.AION_AI_REWARDS_TREASURY }}
          AION_DEVELOPMENT_TREASURY: ${{ secrets.AION_DEVELOPMENT_TREASURY }}
          AION_DIGITAL_RESERVE: ${{ secrets.AION_DIGITAL_RESERVE }}
          AION_STRATEGIC_TREASURY: ${{ secrets.AION_STRATEGIC_TREASURY }}
        run: |
          set -euo pipefail
          for name in DEPLOYER_PRIVATE_KEY AION_FOUNDER_TREASURY AION_COMMUNITY_TREASURY AION_AI_REWARDS_TREASURY AION_DEVELOPMENT_TREASURY AION_DIGITAL_RESERVE AION_STRATEGIC_TREASURY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required GitHub secret is missing: $name"
              exit 1
            fi
          done
          test -n "${BSC_TESTNET_RPC_URL:-}" || (echo "::error::Testnet RPC URL is empty" && exit 1)
          echo "Testnet configuration validated."
      - name: Deploy AION Coin to BNB Testnet
        env:
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          AION_FOUNDER_TREASURY: ${{ secrets.AION_FOUNDER_TREASURY }}
          AION_COMMUNITY_TREASURY: ${{ secrets.AION_COMMUNITY_TREASURY }}
          AION_AI_REWARDS_TREASURY: ${{ secrets.AION_AI_REWARDS_TREASURY }}
          AION_DEVELOPMENT_TREASURY: ${{ secrets.AION_DEVELOPMENT_TREASURY }}
          AION_DIGITAL_RESERVE: ${{ secrets.AION_DIGITAL_RESERVE }}
          AION_STRATEGIC_TREASURY: ${{ secrets.AION_STRATEGIC_TREASURY }}
        run: npm run deploy:coin:testnet
