name: AION Full Test Suite

on:
  push:
    branches: [main]
    paths:
      - "**.js"
      - "**.json"
      - "config/**"
      - "chain/**"
      - "protocol/**"
      - "tests/**"
      - ".github/workflows/aion-full-tests.yml"
  pull_request:
    paths:
      - "**.js"
      - "**.json"
      - "config/**"
      - "chain/**"
      - "protocol/**"
      - "tests/**"
      - ".github/workflows/aion-full-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm test
