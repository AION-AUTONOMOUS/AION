<h1>🤖 فريق AION الذكي</h1>
<p class="sub">10,000 دور ذكي عبر 20 قسمًا — يعملون عبر Runtime مشترك</p>

<div class="stats">
<div class="stat"><div class="num" id="totalAgents">—</div><div class="lbl">إجمالي الوكلاء</div></div>
<div class="stat"><div class="num" id="totalDepts">—</div><div class="lbl">أقسام متخصصة</div></div>

<script>
let FLEET = null;
async function loadFleet(){
  const res=await fetch('/api/fleet',{headers:{Accept:'application/json'}});
  const data=await res.json();
  if(!res.ok||!data.success) throw new Error(data.error||'Fleet unavailable');
  FLEET=data.fleet;
  document.getElementById('totalAgents').textContent=Number(FLEET.total_agents).toLocaleString('ar-SA');
  document.getElementById('totalDepts').textContent=Number(FLEET.departments).toLocaleString('ar-SA');
  render('');
}
function render(filter){
  filter=(filter||'').toLowerCase();
  const container=document.getElementById('agentsContainer');
  container.innerHTML='';
  Object.entries(FLEET.counts).forEach(function(entry){
    const dept=entry[0], count=entry[1];
    const match=!filter||dept.toLowerCase().includes(filter);
    if(!match)return;
    const title=document.createElement('div');
    title.className='dept-title';
    title.innerHTML='🤖 '+dept+' <span>('+Number(count).toLocaleString('ar-SA')+' دور مسجل)</span>';
    container.appendChild(title);
    const note=document.createElement('div');
    note.className='sub';
    note.style.marginBottom='20px';
    note.textContent='يتم اختيار الأدوار وتشغيل المهام عبر Control Plane وRuntime المشترك. لا يتم إنشاء Function مستقلة لكل دور.';
    container.appendChild(note);
  });
}
document.getElementById('search').addEventListener('input',function(e){render(e.target.value)});
loadFleet().catch(function(error){
  document.getElementById('agentsContainer').innerHTML='<div class="sub">تعذر تحميل بيانات Fleet الحية حاليًا.</div>';
});
</script>
