<script>
let FLEET = null;
async function loadFleet(){
  const res=await fetch('/api/fleet',{headers:{Accept:'application/json'}});
  const data=await res.json();
  if(!res.ok||!data.success) throw new Error(data.error||'Fleet unavailable');
  FLEET=data.fleet;
  document.getElementById('totalAgents').textContent=Number(FLEET.total_agents).toLocaleString('ar-SA');
  document.getElementById('totalDepts').textContent=Number(FLEET.departments).toLocaleString('ar-SA');
  render('');
}
function render(filter){
  filter=(filter||'').trim().toLowerCase();
  const container=document.getElementById('agentsContainer');
  container.innerHTML='';
  const departments=Array.isArray(FLEET.department_details)?FLEET.department_details:[];
  const visible=departments.filter(function(dept){
    const haystack=[
      dept.id, dept.name, dept.mission,
      ...(Array.isArray(dept.specialties)?dept.specialties:[])
    ].join(' ').toLowerCase();
    return !filter || haystack.includes(filter);
  });

  const status=document.createElement('div');
  status.className='section-status';
  status.textContent='✓ '+visible.length+' / '+departments.length+' أقسام الشركة متاحة الآن — '+Number(FLEET.total_agents).toLocaleString('ar-SA')+' دور مسجل';
  container.appendChild(status);

  const grid=document.createElement('div');
  grid.className='grid';

  visible.forEach(function(dept){
    const card=document.createElement('article');
    card.className='dept-card';

    const head=document.createElement('div');
    head.className='head';
    head.innerHTML='<div class="name">🤖 '+escapeHtml(dept.name)+'</div><div class="count">'+Number(dept.count).toLocaleString('ar-SA')+' دور</div>';
    card.appendChild(head);

    const mission=document.createElement('div');
    mission.className='mission';
    mission.textContent=dept.mission || '';
    card.appendChild(mission);

    const tags=document.createElement('div');
    tags.className='tags';
    (dept.specialties||[]).forEach(function(specialty){
      const tag=document.createElement('span');
      tag.className='tag';
      tag.textContent=specialty;
      tags.appendChild(tag);
    });
    card.appendChild(tags);
    grid.appendChild(card);
  });

  container.appendChild(grid);
}

function escapeHtml(value){
  return String(value||'').replace(/[&<>"']/g,function(char){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char];
  });
}

document.getElementById('search').addEventListener('input',function(e){render(e.target.value)});
loadFleet().catch(function(error){
  document.getElementById('agentsContainer').innerHTML='<div class="sub">تعذر تحميل بيانات Fleet الحية حاليًا.</div>';
});
</script>
